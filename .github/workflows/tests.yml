name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run deterministic OMP regression tests
        run: |
          for test in $(printf '%s\n' scripts/test-*.mjs | LC_ALL=C sort); do
            bun "$test"
          done
