# Per-model OMP metadata overrides managed by ai-config.
# Luna uses the provider's one-million-token context metadata; Sol and Terra use 400,000.
providers:
  openai-codex:
    modelOverrides:
      gpt-5.6-luna:
        contextWindow: 1000000
      gpt-5.6-sol:
        contextWindow: 400000
      gpt-5.6-terra:
        contextWindow: 400000
